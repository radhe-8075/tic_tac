<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
</head>
<body>
    <center>
        <h1>Tic Tac Toe</h1>
       <div id="game">
        <div id="box">
            <div id="c1" class="cell" onclick="playerclick('c1')"></div>
            <div id="c2" class="cell" onclick="playerclick('c2')"></div>
            <div id="c3" class="cell" onclick="playerclick('c3')"></div>
            <div id="c4" class="cell" onclick="playerclick('c4')"></div>
            <div id="c5" class="cell" onclick="playerclick('c5')"></div>
            <div id="c6" class="cell" onclick="playerclick('c6')"></div>
            <div id="c7" class="cell" onclick="playerclick('c7')"></div>
            <div id="c8" class="cell" onclick="playerclick('c8')"></div>
            <div id="c9" class="cell" onclick="playerclick('c9')"></div>
        </div>
       </div>
       <br><br>
       <h2 id="turn">X's turn</h2>
       <button id="restart" onclick="restartGame()" >restart</button>
    </center>
    <script src="script.js"></script>
</body>
</html>
